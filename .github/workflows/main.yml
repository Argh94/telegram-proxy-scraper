name: Telegram Proxy Scraper

on:
  schedule:
    - cron: '0 */3 * * *'  
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' 

    - name: Create or update requirements.txt
      working-directory: ./Files
      run: |
        echo -e "requests\nbeautifulsoup4\npytz\njdatetime" > requirements.txt
        cat requirements.txt

    - name: Install dependencies
      working-directory: ./Files
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      working-directory: ./Files
      run: python main.py  

    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git checkout main
        git add proxy.txt README.md Files/requirements.txt
        git diff --quiet && git diff --staged --quiet || git commit -m "⛓️‍💥 Argh94 Update"
        git push || echo "No changes to push"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
